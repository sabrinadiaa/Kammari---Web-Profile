<!doctype html>
<html lang="id">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Kammari Cafe & Roastery</title>
  <meta name="description" content="Menu kopi, non-kopi, roti, dan makanan Kammari di Gresik dan Surabaya.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&family=Hanken+Grotesk:wght@400;500;600&display=swap"
    rel="stylesheet">
 
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/menu.css">
 

</head>

<body data-page="menu">
  <header id="site-header"></header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <h1 class="h-xl">
          Buku menu<br>
          <span class="brand-word">Kammari</span>
        </h1>
        <p class="lede">
          Jelajahi pilihan makanan, camilan, minuman, dan
          menu spesial Kammari. Pilih cabang Gresik atau
          Surabaya untuk melihat menu dan harga yang tersedia.
        </p>
        <div class="segmented" id="branch-toggle" role="group" aria-label="Pilih cabang">
          <button data-branch="gresik" aria-pressed="true">Gresik</button>
          <button data-branch="surabaya" aria-pressed="false">Surabaya</button>
        </div>
      </div>
    </section>

    <div class="menu-bar">
      <div class="wrap">
        <p class="note" id="branch-note"></p>
        <nav class="chips" id="cat-nav" aria-label="Kategori menu"></nav>
      </div>
    </div>

    <div class="wrap" id="menu-root" aria-live="polite"></div>
    <div style="height:clamp(72px,10vw,140px)"></div>
  </main>

  <footer id="site-footer"></footer>
  <script src="js/script.js"></script>
</body>

</html>
