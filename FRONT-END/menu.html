<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Menu | Kammari Cafe & Roastery</title>
  <meta name="description" content="Menu kopi, non-kopi, roti, dan makanan Kammari di Gresik dan Surabaya.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..600,0..100,0..1;1,9..144,300..600,0..100,0..1&family=Hanken+Grotesk:wght@400;500;600&family=Rethink+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- naikkan ?v= setiap CSS diubah. Jangan taruh tag script di head -->
  <link rel="stylesheet" href="css/base.css?v=9">
  <link rel="stylesheet" href="css/menu.css?v=15">
  <link rel="stylesheet" href="css/menu-motion.css?v=9">
</head>
<body data-page="menu">
  <header id="site-header"></header>
  <main>

    <!-- HERO -->
    <section class="menu-hero">
      <div class="wrap menu-hero__grid">
        <div class="menu-hero__text">
          <h1>
            <span class="menu-hero__title-top">
              Dari Dapur
              <span class="kammari-logo" role="img" aria-label="Kammari"></span>
            </span>
            <span class="menu-hero__title-bottom">
              Mengalun Rasa dalam<br>
              Setiap Hidangan
            </span>
          </h1>
          <p class="lede">Kaki555 menghadirkan hidangan lezat dengan harga bersahabat, serta penawaran spesial melalui paket menu yang menarik.</p>
          <div class="menu-hero__pick">
            <p class="menu-hero__pick-label">Pilih cabang untuk melihat menu</p>
            <div class="segmented" role="group" aria-label="Pilih cabang">
              <button type="button" data-branch="surabaya" aria-pressed="false">Surabaya</button>
              <button type="button" data-branch="gresik" aria-pressed="false">Gresik</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <p class="wrap menu-status" id="menu-status" aria-live="polite" hidden></p>

    <!-- MAKANAN -->
    <section class="section" id="menu-makanan">
      <div class="wrap">
        <div class="venue__intro">
          <span class="kicker" data-count>Makanan</span>
          <h2 class="h-lg">Makanan</h2>
        </div>
        <nav class="menu-category-nav" id="menu-cats-makanan" aria-label="Kategori makanan"></nav>
        <div class="mlist"></div>
      </div>
    </section>

    <!-- PEMISAH FOTO (satu blok saja) -->
    <div class="menu-divider" id="menu-divider">
      <img class="menu-divider__image" src="assets/menu-seasonal/heroPage1.jpeg" alt="" decoding="async">
      <div class="menu-divider__overlay"></div>
      <div class="menu-divider__content">
        <span class="kammari-logo" role="img" aria-label="Kammari Cafe & Roastery"></span>
      </div>
    </div>

    <!-- MINUMAN -->
    <section class="section" id="menu-minuman">
      <div class="wrap">
        <div class="venue__intro">
          <span class="kicker" data-count>Minuman</span>
          <h2 class="h-lg">Minuman</h2>
        </div>
        <nav class="menu-category-nav" id="menu-cats-minuman" aria-label="Kategori minuman"></nav>
        <div class="mlist"></div>
      </div>
    </section>
    <section class="menu-endnote" aria-label="Penutup menu Kammari">
      <div class="wrap menu-endnote__art">
        <img
          src="assets/menu-seasonal/menu-line-art.png"
          alt=""
          loading="lazy"
          decoding="async"
        >
      </div>

      <a class="menu-endnote__banner" href="#menu-makanan">
        <span class="menu-endnote__title">Dari dapur ke meja.</span>
      </a>
</section>
  </main>
  <footer id="site-footer"></footer>

  <!-- Script: hanya di sini, satu kali, urutan ini -->
  <script src="js/core.js"></script>
  <script src="js/menu.js?v=6"></script>
  <script src="js/menu-motion.js?v=10"></script>
  <script>
    const wa = document.getElementById("reserve-wa");
    if (wa && typeof WA_LINK !== "undefined") wa.href = WA_LINK;
  </script>
</body>
</html>
