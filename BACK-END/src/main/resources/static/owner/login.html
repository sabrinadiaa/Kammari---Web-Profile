
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Portal Pengelolaan Kammari Café & Roastery">

  <title>Login Owner | Kammari</title>

  <!-- GOOGLE FONTS -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">

  <!-- OWNER LOGIN CSS -->
  <link
    rel="stylesheet"
    href="/owner/css/login.css">

  <!-- OWNER LOGIN JS -->
  <script
    src="/owner/js/login.js"
    defer></script>
</head>

<body>

  <main class="login-page">

    <!-- PAGE LABEL -->
    <p class="page-label">
      OWNER PORTAL
    </p>

    <!-- MAIN LOGIN CARD -->
    <section
      class="login-shell"
      aria-label="Login Owner Kammari">

      <!-- =================================
           LEFT — PHOTO & KAMMARI BRANDING
      ================================== -->
      <div class="login-visual">

        <!-- FOTO KAMMARI -->
        <img
          class="visual-image"
          src="/assets/fasilitas/gresik/ruang-utama-dan-meja-bar.jpg"
          alt="Suasana interior Kammari Café"
          loading="eager">

        <!-- OVERLAY -->
        <div
          class="visual-overlay"
          aria-hidden="true">
        </div>

        <!-- LOGO KAMMARI SVG MASK -->
        <div class="visual-brand">

          <div
            class="kammari-wordmark-mask"
            role="img"
            aria-label="KAMMARI">
          </div>

        </div>

        <!-- LOCATION -->
        <div class="visual-location">
          <span>GRESIK</span>
          <span class="location-dot">·</span>
          <span>SURABAYA</span>
        </div>

      </div>

      <!-- =================================
           RIGHT — LOGIN FORM
      ================================== -->
      <div class="login-panel">

        <div class="login-panel-inner">

          <!-- HEADER -->
          <header class="login-header">

            <p class="form-eyebrow">
              KAMMARI MANAGEMENT
            </p>

            <h1 class="form-title">
              Login Owner
            </h1>

            <p class="form-subtitle">
              Masuk untuk mengelola Kammari.
            </p>

          </header>

          <!-- LOGIN FORM -->
          <form
            id="loginForm"
            class="login-form"
            method="post">

            <!-- USERNAME -->
            <div class="field-group">

              <label for="email">
                Username
              </label>

              <!--
                ID email dipertahankan agar
                kompatibel dengan login.js Owner.
              -->
              <input
                type="text"
                id="email"
                name="email"
                placeholder="Masukkan username"
                autocomplete="username"
                spellcheck="false"
                autocapitalize="none"
                required>

            </div>

            <!-- PASSWORD -->
            <div class="field-group">

              <label for="password">
                Password
              </label>

              <div class="password-field">

                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Masukkan password"
                  autocomplete="current-password"
                  required>

                <!-- TOGGLE PASSWORD -->
                <button
                  type="button"
                  id="togglePassword"
                  class="toggle-password"
                  aria-label="Tampilkan password"
                  aria-pressed="false">
                  Lihat
                </button>

              </div>

            </div>

            <!-- LOGIN MESSAGE -->
            <p
              id="loginMessage"
              class="login-message"
              role="status"
              aria-live="polite">
            </p>

            <!-- SUBMIT BUTTON -->
            <button
              type="submit"
              id="loginButton"
              class="login-button">

              <span>Masuk</span>

              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true">

                <path d="M5 12h14"/>
                <path d="m13 6 6 6-6 6"/>

              </svg>

            </button>

          </form>

          <!-- FOOTER -->
          <p class="form-footer">
            Kammari Café & Roastery
          </p>

        </div>

      </div>

    </section>

    <!-- COPYRIGHT -->
    <footer class="copyright">
      © 2026 Kammari
    </footer>

  </main>

</body>
</html>
